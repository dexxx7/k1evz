<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="k1evz — Darwin. Security Analyst e Software Engineer focado em Reverse Engineering, low-level e Windows Internals.">
  <meta name="theme-color" content="#0c0614">
  <title>k1evz — Darwin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       DESIGN TOKENS
    ========================================================= */

    :root {
      --bg: #0c0614;
      --bg-soft: #11091b;
      --surface: rgba(20, 11, 31, .82);
      --surface-solid: #140b1f;
      --surface-hover: #1b1028;

      --text: #f7f2ff;
      --text-soft: #d2c8dc;
      --text-muted: #8d8299;

      --border: rgba(184, 117, 255, .18);
      --border-strong: rgba(184, 117, 255, .42);

      --purple: #a855f7;
      --purple-light: #c084fc;
      --pink: #ec4899;
      --cyan: #22d3ee;
      --green: #4ade80;
      --orange: #fb923c;
      --blue: #60a5fa;
      --red: #f87171;

      --gradient: linear-gradient(135deg, #c084fc, #ec4899);
      --gradient-text: linear-gradient(135deg, #ffffff 15%, #c084fc 55%, #ec4899 100%);

      --shadow-sm: 0 8px 30px rgba(0, 0, 0, .18);
      --shadow-md: 0 18px 50px rgba(0, 0, 0, .28);
      --shadow-glow: 0 0 40px rgba(168, 85, 247, .12);

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;

      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    [data-theme="light"] {
      --bg: #f7f3fb;
      --bg-soft: #eee8f5;
      --surface: rgba(255,255,255,.85);
      --surface-solid: #ffffff;
      --surface-hover: #f4eef9;

      --text: #1a1023;
      --text-soft: #4f4359;
      --text-muted: #766a7f;

      --border: rgba(95, 45, 135, .16);
      --border-strong: rgba(126, 65, 170, .38);

      --shadow-sm: 0 8px 30px rgba(55, 30, 75, .08);
      --shadow-md: 0 18px 50px rgba(55, 30, 75, .13);
    }

    /* =========================================================
       RESET
    ========================================================= */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 45% at 8% -5%, rgba(168,85,247,.20), transparent 65%),
        radial-gradient(ellipse 60% 45% at 95% 5%, rgba(236,72,153,.14), transparent 65%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      line-height: 1.6;
      transition: background .35s ease, color .35s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
      z-index: -1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--purple-light);
      outline-offset: 4px;
    }

    /* =========================================================
       LAYOUT
    ========================================================= */

    .container {
      width: min(100% - 32px, 760px);
      margin-inline: auto;
    }

    main {
      padding-bottom: 80px;
    }

    section {
      margin-bottom: clamp(56px, 8vw, 90px);
    }

    /* =========================================================
       HEADER
    ========================================================= */

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 54px;
    }

    .logo {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -.04em;
      background: var(--gradient);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 9px;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,.025);
      color: var(--text-soft);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition:
        transform .25s var(--ease),
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }

    .icon-button:hover {
      transform: translateY(-3px);
      border-color: var(--border-strong);
      background: rgba(168,85,247,.10);
      box-shadow: var(--shadow-glow);
    }

    .icon-button:active {
      transform: translateY(0) scale(.95);
    }

    .icon {
      width: 18px;
      height: 18px;
    }

    /* =========================================================
       HERO
    ========================================================= */

    .eyebrow {
      color: var(--text-muted);
      font-size: .82rem;
      margin: 0 0 4px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.7rem, 10vw, 4.6rem);
      line-height: 1;
      letter-spacing: -.065em;
      font-weight: 800;
      background: var(--gradient-text);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .username {
      color: var(--text-muted);
      margin: 11px 0 4px;
      font-size: .92rem;
    }

    .role {
      margin: 0;
      font-size: clamp(1rem, 4vw, 1.18rem);
      color: var(--text-soft);
      font-weight: 600;
    }

    .location {
      color: var(--text-muted);
      margin: 5px 0 24px;
      font-size: .9rem;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .badge {
      padding: 8px 12px;
      border-radius: 999px;
      font-size: .73rem;
      font-weight: 700;
      border: 1px solid;
      transition: transform .25s var(--ease), box-shadow .25s ease;
    }

    .badge:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-sm);
    }

    .badge-purple {
      color: #e9d5ff;
      background: rgba(168,85,247,.12);
      border-color: rgba(168,85,247,.38);
    }

    .badge-pink {
      color: #fbcfe8;
      background: rgba(236,72,153,.11);
      border-color: rgba(236,72,153,.38);
    }

    .badge-blue {
      color: #bfdbfe;
      background: rgba(59,130,246,.10);
      border-color: rgba(96,165,250,.35);
    }

    .badge-cyan {
      color: #a5f3fc;
      background: rgba(34,211,238,.09);
      border-color: rgba(34,211,238,.32);
    }

    .badge-green {
      color: #bbf7d0;
      background: rgba(34,197,94,.09);
      border-color: rgba(74,222,128,.32);
    }

    .badge-orange {
      color: #fed7aa;
      background: rgba(249,115,22,.09);
      border-color: rgba(251,146,60,.32);
    }

    .badge-red {
      color: #fecaca;
      background: rgba(239,68,68,.09);
      border-color: rgba(248,113,113,.32);
    }

    /* =========================================================
       STATS
    ========================================================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 11px;
    }

    .stat-card {
      position: relative;
      overflow: hidden;
      padding: 22px 15px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(14px);
      transition:
        transform .3s var(--ease),
        border-color .3s ease,
        box-shadow .3s ease;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      width: 90px;
      height: 90px;
      left: 50%;
      top: -65px;
      transform: translateX(-50%);
      background: rgba(168,85,247,.18);
      filter: blur(30px);
      pointer-events: none;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-strong);
      box-shadow: var(--shadow-md), var(--shadow-glow);
    }

    .stat-number {
      position: relative;
      display: block;
      color: #eadcff;
      font-size: clamp(1.8rem, 7vw, 2.35rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 7px;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: .7rem;
      font-weight: 600;
    }

    /* =========================================================
       SECTION HEADINGS
    ========================================================= */

    .section-kicker {
      color: var(--purple-light);
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin: 0 0 6px;
    }

    h2 {
      margin: 0 0 25px;
      font-size: clamp(1.55rem, 6vw, 2rem);
      letter-spacing: -.045em;
      line-height: 1.15;
    }

    /* =========================================================
       ABOUT
    ========================================================= */

    .about-text {
      display: grid;
      gap: 14px;
      color: var(--text-soft);
      font-size: .94rem;
    }

    .about-text p {
      margin: 0;
    }

    .about-text strong {
      color: var(--text);
    }

    /* =========================================================
       SKILLS
    ========================================================= */

    .skill-group {
      margin-bottom: 30px;
      container-type: inline-size;
    }

    .skill-group-title {
      color: var(--text-muted);
      font-size: .68rem;
      letter-spacing: .17em;
      text-transform: uppercase;
      font-weight: 800;
      margin: 0 0 11px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-button {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 9px 12px;
      background: var(--surface);
      color: var(--text-soft);
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
      transition:
        transform .22s var(--ease),
        border-color .22s ease,
        background .22s ease,
        color .22s ease,
        box-shadow .22s ease;
    }

    .skill-button:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
      background: rgba(168,85,247,.09);
      color: var(--text);
    }

    .skill-button:active {
      transform: scale(.96);
    }

    .skill-button.active {
      color: #f3e8ff;
      border-color: var(--purple);
      background: rgba(168,85,247,.17);
      box-shadow: 0 0 24px rgba(168,85,247,.13);
    }

    .skill-button.active::after {
      content: "";
      position: absolute;
      bottom: -5px;
      left: 50%;
      width: 7px;
      height: 7px;
      transform: translateX(-50%) rotate(45deg);
      background: var(--purple);
    }

    /* =========================================================
       DETAIL PANEL
    ========================================================= */

    .detail-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      margin-top: 0;
      transition:
        grid-template-rows .4s var(--ease),
        opacity .3s ease,
        margin-top .4s var(--ease);
    }

    .detail-panel.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 15px;
    }

    .detail-inner {
      min-height: 0;
      overflow: hidden;
    }

    .detail-card {
      border: 1px solid rgba(168,85,247,.25);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(135deg, rgba(168,85,247,.09), rgba(236,72,153,.045)),
        var(--surface);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .detail-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 16px;
    }

    .detail-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 800;
    }

    .detail-level {
      flex-shrink: 0;
      color: var(--purple-light);
      font-size: .75rem;
      font-weight: 800;
      text-align: right;
    }

    .detail-level span {
      display: block;
      color: var(--text-muted);
      font-size: .65rem;
      margin-top: 2px;
    }

    .progress {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(168,85,247,.12);
      overflow: hidden;
      margin-bottom: 15px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--gradient);
      transition: width .8s var(--ease);
    }

    .detail-description {
      color: var(--text-soft);
      font-size: .82rem;
      margin: 0 0 16px;
    }

    .tool-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tool {
      padding: 5px 9px;
      border-radius: 7px;
      background: rgba(255,255,255,.035);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: .68rem;
    }

    /* =========================================================
       PROJECTS
    ========================================================= */

    .project-list {
      display: grid;
      gap: 11px;
    }

    .project {
      position: relative;
      overflow: hidden;
      padding: 21px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      transition:
        transform .3s var(--ease),
        border-color .3s ease,
        background .3s ease;
    }

    .project:hover {
      transform: translateY(-4px);
      border-color: var(--border-strong);
      background: var(--surface-hover);
    }

    .project-number {
      color: var(--purple-light);
      font-size: .67rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .project h3 {
      margin: 0 0 7px;
      font-size: 1rem;
    }

    .project p {
      margin: 0 0 10px;
      color: var(--text-soft);
      font-size: .8rem;
    }

    .project-stack {
      color: var(--text-muted);
      font-size: .67rem;
    }

    /* =========================================================
       EXPERIENCE
    ========================================================= */

    .timeline {
      position: relative;
      padding-left: 25px;
      border-left: 1px solid var(--border-strong);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 34px;
    }

    .timeline-item:last-child {
      margin-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -31px;
      top: 4px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--gradient);
      box-shadow: 0 0 15px rgba(168,85,247,.4);
    }

    .timeline-date {
      color: var(--purple-light);
      font-size: .73rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .timeline h3 {
      margin: 0 0 2px;
      font-size: .95rem;
    }

    .timeline-company {
      color: var(--text-muted);
      font-size: .72rem;
      margin-bottom: 8px;
    }

    .timeline-description {
      color: var(--text-soft);
      font-size: .8rem;
      margin: 0;
    }

    /* =========================================================
       CONTACT
    ========================================================= */

    .contact-card {
      padding: 25px 20px;
      text-align: center;
      border: 1px solid rgba(168,85,247,.28);
      border-radius: var(--radius-lg);
      background:
        radial-gradient(circle at 50% 0%, rgba(168,85,247,.14), transparent 55%),
        var(--surface);
      box-shadow: var(--shadow-md);
    }

    .contact-card h3 {
      margin: 0 0 5px;
    }

    .contact-card > p {
      color: var(--text-muted);
      font-size: .8rem;
      margin: 0 0 18px;
    }

    .contact-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
    }

    .primary-button,
    .secondary-button {
      border-radius: 11px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: 700;
      font-size: .78rem;
      transition:
        transform .22s var(--ease),
        box-shadow .22s ease,
        background .22s ease;
    }

    .primary-button {
      border: 0;
      color: white;
      background: var(--gradient);
      box-shadow: 0 8px 25px rgba(168,85,247,.18);
    }

    .secondary-button {
      border: 1px solid var(--border);
      color: var(--text-soft);
      background: rgba(255,255,255,.03);
    }

    .primary-button:hover,
    .secondary-button:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .primary-button:active,
    .secondary-button:active {
      transform: scale(.96);
    }

    /* =========================================================
       TOAST
    ========================================================= */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 100;
      transform: translate(-50%, 25px);
      opacity: 0;
      pointer-events: none;
      padding: 11px 16px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: rgba(20,11,31,.94);
      color: var(--text);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(15px);
      font-size: .75rem;
      font-weight: 700;
      transition: opacity .25s ease, transform .3s var(--ease);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      padding: 28px 0 10px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: .72rem;
    }

    .footer-name {
      font-weight: 800;
      background: var(--gradient);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    /* =========================================================
       REVEAL ANIMATION
    ========================================================= */

    .reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .js .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition:
        opacity .7s var(--ease),
        transform .7s var(--ease);
    }

    .js .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================================================
       RESPONSIVE
    ========================================================= */

    @media (min-width: 600px) {
      .container {
        width: min(100% - 48px, 760px);
      }

      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .project-list {
        grid-template-columns: repeat(3, 1fr);
      }

      .project {
        min-height: 205px;
      }
    }

    @media (min-width: 900px) {
      .container {
        width: min(100% - 64px, 820px);
      }

      .site-header {
        padding-top: 38px;
      }

      .hero {
        margin-bottom: 85px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
